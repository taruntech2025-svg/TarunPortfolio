<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Tarun Web Studio | Modern Websites for Small Businesses</title>
<meta name="description" content="Tarun Web Studio builds clean, responsive, modern websites for small businesses, brands, and entrepreneurs."/>
<style>:root{--bg:#09090b;--bg2:#131316;--card:#17171b;--line:#26262c;--text:#f5f5f7;--mute:#a1a1aa;--v:#8b5cf6;--v2:#c4b5fd;--grad:linear-gradient(135deg,#7c3aed,#a78bfa)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--v2);outline-offset:3px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(2.3rem,6vw,4.2rem);font-weight:750}
h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;margin-bottom:14px}
h3{font-size:1.15rem;font-weight:650;margin-bottom:8px}
p{color:var(--mute)}
.header{position:sticky;top:0;z-index:20;background:rgba(9,9,11,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-weight:700;letter-spacing:-.01em}
nav a{color:var(--mute);padding:8px 14px;border-radius:10px;transition:color .2s,background .2s}
nav a:hover{color:var(--text);background:var(--bg2)}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px;cursor:pointer}
@media(max-width:760px){
.burger{display:block}
nav#menu{position:absolute;top:68px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);display:none;flex-direction:column;padding:10px 20px 18px}
nav#menu.open{display:flex}
}
.hero{padding:clamp(48px,9vw,110px) 0 clamp(48px,8vw,90px);overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
.brand-line{color:var(--v2);font-weight:600;margin-bottom:16px}
.lead{font-size:1.15rem;max-width:520px;margin:22px 0 30px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:600;border:1px solid transparent;cursor:pointer;font:inherit;font-weight:600;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.primary{background:var(--grad);color:#fff;box-shadow:0 8px 28px -8px rgba(139,92,246,.6)}
.ghost{border-color:var(--line);background:var(--bg2);color:var(--text)}
.ghost:hover{border-color:var(--v)}
.wa{background:#1fa855;color:#fff}
.visual{position:relative;min-height:340px}
.glow{position:absolute;inset:10% 5%;background:radial-gradient(circle,rgba(139,92,246,.45),transparent 65%);filter:blur(40px)}
.mock{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
.mock.big{width:88%;margin-left:auto;animation:rise .9s ease both}
.mock.small{position:absolute;left:0;bottom:-10px;width:44%;animation:rise .9s .2s ease both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.dots{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dots i{width:9px;height:9px;border-radius:50%;background:#34343c}
.mock-body{padding:18px;display:grid;gap:10px}
.mock-body b{font-size:1rem;display:block}
.mock.big .mock-body b{height:22px;width:70%;background:var(--grad);border-radius:6px}
.l{height:9px;border-radius:5px;background:#2a2a31;display:block}
.w60{width:60%}.w40{width:40%}
.pill{height:30px;width:110px;border-radius:9px;background:var(--grad);display:block}
.mock-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.mock-row em{height:54px;border-radius:10px;background:#1f1f25;border:1px solid var(--line)}
.section{padding:clamp(56px,8vw,96px) 0}
.intro{max-width:560px;margin-bottom:34px}
.about{max-width:680px;font-size:1.15rem;margin:8px 0 34px}
.sub{margin-bottom:14px}
.skills{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.skills li{display:flex;align-items:center;gap:9px;padding:10px 16px;border:1px solid var(--line);background:var(--card);border-radius:999px}
.skills svg{color:var(--v2)}
.grid{display:grid;gap:20px;margin-top:30px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g3,.g4,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;transition:border-color .25s,transform .25s;box-shadow:0 14px 40px -24px rgba(0,0,0,.9)}
.card:hover{border-color:#4c3a86}
.card p{margin-bottom:18px}
.ico{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:13px;background:rgba(139,92,246,.14);color:var(--v2);margin-bottom:16px}
.steps{list-style:none;padding:0}
.steps .card p{margin-bottom:0}
.step{display:block;color:var(--v2);font-size:.85rem;font-weight:600;margin-bottom:4px;letter-spacing:0}
.project{padding:0;overflow:hidden}
.project .mock{border-radius:0;border-width:0 0 1px;box-shadow:none}
.pbody{padding:26px}
.tag{display:inline-block;color:var(--v2);background:rgba(139,92,246,.14);padding:3px 12px;border-radius:999px;font-size:.85rem;margin-bottom:12px}
.placeholder{border-style:dashed;display:grid;align-content:center;text-align:center;min-height:260px}
.placeholder:hover{border-color:var(--line)}
code{background:var(--bg2);padding:2px 6px;border-radius:6px;font-size:.9em}
.contact-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:28px;align-items:start}
@media(max-width:820px){.contact-grid{grid-template-columns:1fr}}
.contact-links{display:grid;gap:14px}
.note{font-size:.9rem}
.form{display:grid;gap:16px}
.form label{display:grid;gap:6px;font-weight:500;font-size:.95rem}
.form input,.form textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--v)}
.form .note{margin:0}
.cta{padding:clamp(56px,8vw,90px) 0;text-align:center}
.cta .wrap{background:radial-gradient(120% 140% at 50% 0,rgba(139,92,246,.28),var(--card) 70%);border:1px solid var(--line);border-radius:28px;padding:clamp(36px,6vw,64px) 24px}
.cta p{max-width:520px;margin:0 auto 26px}
.footer{border-top:1px solid var(--line);padding:48px 0 24px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:32px}
@media(max-width:760px){.foot-grid{grid-template-columns:1fr}}
.footer h3{font-size:1rem}
.footer a{display:block;color:var(--mute);padding:3px 0;word-break:break-word}
.footer nav a{padding:3px 0;border-radius:0}
.footer a:hover{color:var(--text);background:none}
.copy{width:min(1120px,100% - 40px);margin:32px auto 0;padding-top:20px;border-top:1px solid var(--line);font-size:.9rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style></head><body>
<div id="app"></div>
<script>
// Edit everything here: contact details, copy, services, projects.
const brand = 'Tarun Web Studio'

const contact = {
  whatsappDisplay: '+91 8778787566',
  whatsappUrl: 'https://wa.me/918778787566',
  email: 'tarunmurugan2025@gmail.com',
  emailUrl: 'mailto:tarunmurugan2025@gmail.com',
}

const nav = [
  ['Home', '#home'], ['About', '#about'], ['Services', '#services'],
  ['Projects', '#projects'], ['Contact', '#contact'],
]

const hero = {
  heading: 'I Build Modern Websites That Help Businesses Grow.',
  text: 'Professional, responsive, and modern websites for small businesses, brands, and entrepreneurs.',
}

const about = "I'm a website developer focused on creating clean, responsive, and user-friendly websites. I help small businesses establish their online presence with professional website designs."

const skills = [
  ['HTML', 'code'], ['CSS', 'palette'], ['JavaScript', 'bolt'],
  ['Responsive Web Design', 'devices'], ['UI/UX Design', 'pen'],
  ['GitHub', 'branch'], ['Vercel Deployment', 'rocket'], ['Website Development', 'layout'],
]

const services = [
  ['Business Website Development', 'Professional websites for local shops and small businesses.', 'layout'],
  ['Landing Page Development', 'Attractive landing pages designed to present products and services.', 'rocket'],
  ['Product and Service Websites', 'Websites that showcase products, services, images, and business information.', 'grid'],
  ['Responsive Website Design', 'Websites optimized for mobile phones, tablets, and computers.', 'devices'],
  ['Website Updates and Maintenance', 'Updates and improvements for existing websites.', 'wrench'],
]

const projects = [
  {
    name: 'Murugan Tea Stall & Malligai Swathu',
    category: 'Local Business Website',
    description: 'A local business website project designed to showcase business information, menu content, and contact options in a clean, mobile-friendly layout.',
    url: 'https://muruganmalligai.vercel.app',
    previewTitle: 'Murugan Tea Stall',
  },
]
const placeholderCount = 1

const process = [
  ['Understand Your Requirements', 'We talk through your business, goals, and what the website needs to do.', 'chat'],
  ['Design and Build', 'I design a clean layout and build it to work on every screen size.', 'layout'],
  ['Review and Revisions', 'You review the site and I make the changes you ask for.', 'pen'],
  ['Deploy and Handover', 'The website goes live and I hand over what you need to manage it.', 'rocket'],
]

const paths={
  code: 'M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16',
  palette: 'M12 3a9 9 0 100 18c1.5 0 2-1 1.5-2s0-2 1.5-2h2a3 3 0 003-3c0-5-3.5-11-8-11zM7.5 12h.01M9 8h.01M14 7h.01',
  bolt: 'M13 2L4 14h7l-1 8 9-12h-7z',
  devices: 'M3 6h14v10H3zM1 20h18M17 9h4v10h-4z',
  pen: 'M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3',
  branch: 'M6 3v12M18 9a3 3 0 100-6 3 3 0 000 6zM6 21a3 3 0 100-6 3 3 0 000 6zM18 9c0 6-12 3-12 6',
  rocket: 'M5 15c-1 1-2 4-2 6 2 0 5-1 6-2M14 4c4-1 6-1 6-1s0 2-1 6l-7 7-5-5zM9 14l-3-1 3-4M10 15l1 3 4-3',
  layout: 'M3 4h18v16H3zM3 9h18M9 9v11',
  grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  wrench: 'M14 6a4 4 0 005 5l-9 9a2 2 0 01-3-3l9-9a4 4 0 00-2-2z',
  chat: 'M4 5h16v11H9l-5 4z',
  mail: 'M3 5h18v14H3zM3 6l9 7 9-7',
  whatsapp: 'M3 21l1.5-5A8.5 8.5 0 1112 20.5a8.5 8.5 0 01-4-1zM9 8c0 4 3 7 7 7l1-2-2-1-1 1c-1 0-2-1-3-2l1-1-1-2z',
  menu: 'M4 7h16M4 12h16M4 17h16',
  close: 'M6 6l12 12M18 6L6 18',
  external: 'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6',};
const I=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]}"/></svg>`;
const mock=t=>`<div class="mock" role="img" aria-label="CSS preview mockup of the ${t} website"><div class="dots"><i></i><i></i><i></i></div><div class="mock-body"><b>${t}</b><span class="l w60"></span><span class="l w40"></span><div class="mock-row"><em></em><em></em><em></em></div></div></div>`;
const pc=p=>`<article class="card project">${mock(p.previewTitle||p.name)}<div class="pbody"><span class="tag">${p.category}</span><h3>${p.name}</h3><p>${p.description}</p><div class="btns"><a class="btn primary" href="${p.url}" target="_blank" rel="noopener noreferrer">View Live Website ${I('external',16)}</a><a class="btn ghost" href="${p.url}" target="_blank" rel="noopener noreferrer">View Project</a></div></div></article>`;
const sec=(id,t,body,intro='')=>`<section id="${id}" class="section" aria-labelledby="${id}-t"><div class="wrap"><h2 id="${id}-t">${t}</h2>${intro?`<p class="intro">${intro}</p>`:''}${body}</div></section>`;
const links=nav.map(([l,h])=>`<a href="${h}">${l}</a>`).join('');
document.getElementById('app').innerHTML=`
<header class="header"><div class="wrap bar"><a href="#home" class="logo">${brand}</a>
<button class="burger" id="bg" aria-label="Open menu" aria-expanded="false" aria-controls="menu">${I('menu')}</button>
<nav id="menu" aria-label="Main navigation">${links}</nav></div></header>
<main><section id="home" class="hero"><div class="wrap hero-grid"><div><p class="brand-line">${brand}</p><h1>${hero.heading}</h1><p class="lead">${hero.text}</p>
<div class="btns"><a class="btn primary" href="#projects">View My Work</a><a class="btn ghost" href="#contact">Let's Talk</a></div></div>
<div class="visual" aria-hidden="true"><div class="glow"></div><div class="mock big"><div class="dots"><i></i><i></i><i></i></div><div class="mock-body"><b></b><span class="l w60"></span><span class="l w40"></span><span class="pill"></span><div class="mock-row"><em></em><em></em><em></em></div></div></div><div class="mock small"><div class="mock-body"><span class="l w60"></span><span class="l w40"></span></div></div></div></div></section>
${sec('about','About Me',`<p class="about">${about}</p><h3 class="sub">Skills</h3><ul class="skills">${skills.map(([s,i])=>`<li>${I(i,20)}${s}</li>`).join('')}</ul>`)}
${sec('services','Services',`<div class="grid g3">${services.map(([t,d,i])=>`<article class="card"><span class="ico">${I(i)}</span><h3>${t}</h3><p>${d}</p><a class="btn ghost" href="#contact">Discuss Your Project</a></article>`).join('')}</div>`)}
${sec('projects','My Projects',`<div class="grid g2">${projects.map(pc).join('')}<article class="card placeholder" aria-label="Placeholder for a future project"><h3>Future project</h3><p>Placeholder for a project to be added later.</p></article></div>`)}
${sec('process','Work Process',`<ol class="grid g4 steps">${process.map(([t,d,i],n)=>`<li class="card"><span class="ico">${I(i)}</span><h3><span class="step">Step ${n+1}</span>${t}</h3><p>${d}</p></li>`).join('')}</ol>`)}
${sec('contact',"Let's Build Something Great Together",`<div class="contact-grid"><div class="contact-links"><a class="btn wa" href="${contact.whatsappUrl}" target="_blank" rel="noopener noreferrer">${I('whatsapp',20)}Chat on WhatsApp</a><a class="btn primary" href="${contact.emailUrl}">${I('mail',20)}Send an Email</a><p class="note">${contact.whatsappDisplay}<br>${contact.email}</p></div>
<form class="card form" id="f"><label>Name<input name="n" required autocomplete="name"></label><label>Email<input name="e" type="email" required autocomplete="email"></label><label>Project Details<textarea name="d" rows="5" required></textarea></label><button class="btn primary" type="submit">Send Message</button><p class="note">This form has no server. Sending opens your email app with the message ready to send.</p></form></div>`,"Have a business or website idea? Get in touch to discuss your project.")}
<section class="cta"><div class="wrap"><h2>Ready to Take Your Business Online?</h2><p>Let's create a professional website that gives your business a strong online presence.</p><a class="btn primary" href="#contact">Contact Me</a></div></section></main>
<footer class="footer"><div class="wrap foot-grid"><div><strong class="logo">${brand}</strong><p>Building modern digital experiences for businesses.</p></div><nav aria-label="Footer navigation"><h3>Quick Links</h3>${links}</nav><div><h3>Contact</h3><a href="${contact.whatsappUrl}" target="_blank" rel="noopener noreferrer">WhatsApp: ${contact.whatsappDisplay}</a><a href="${contact.emailUrl}">Email: ${contact.email}</a></div></div><p class="copy">© ${new Date().getFullYear()} ${brand}. All rights reserved.</p></footer>`;
const m=document.getElementById('menu'),b=document.getElementById('bg');
b.onclick=()=>{const o=m.classList.toggle('open');b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Close menu':'Open menu')};
m.onclick=e=>{if(e.target.tagName==='A'){m.classList.remove('open');b.setAttribute('aria-expanded',false)}};
document.getElementById('f').onsubmit=e=>{e.preventDefault();const f=e.target;
location.href=`mailto:${contact.email}?subject=${encodeURIComponent('Website enquiry from '+f.n.value)}&body=${encodeURIComponent('Name: '+f.n.value+'\nEmail: '+f.e.value+'\n\nProject details:\n'+f.d.value)}`};
</script></body></html>
